[package]
name = "apexuse-mcp"
version = "0.3.0"
edition = "2021"
description = "Local-first cross-platform Computer Use MCP server using native Accessibility, Set-of-Mark visual grounding, OCR, and workflow memory"
license = "MIT"
repository = "https://github.com/Jackpkn/apexuse"
homepage = "https://github.com/Jackpkn/apexuse"
readme = "../README.md"
keywords = ["mcp", "computer-use", "automation", "accessibility", "set-of-mark"]
categories = ["command-line-utilities", "development-tools", "gui", "os"]

[lib]
name = "apexuse_mcp"
path = "src/lib.rs"

[[bin]]
name = "apexuse-mcp"
path = "src/main.rs"
